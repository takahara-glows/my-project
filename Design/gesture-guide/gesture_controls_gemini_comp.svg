<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="176" viewBox="0 0 1920 176" role="img" aria-labelledby="title desc">
  <title id="title">Gesture controls bottom UI comp using supplied icons</title>
  <desc id="desc">A clean horizontal bottom black bar using the supplied white icons, scaled and recomposed for a readable guide UI.</desc>
  <defs>
    <style>
      .bg { fill: #000; }
      .divider { stroke: #fff; stroke-width: 1; opacity: .26; }
      .label { fill: #fff; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 23px; font-weight: 700; letter-spacing: 0; }
      .hint { fill: #fff; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; font-weight: 500; letter-spacing: 0; }
    </style>
  </defs>

  <rect class="bg" width="1920" height="176"/>

  <g text-anchor="middle">
    <svg x="118" y="14" width="156" height="86" viewBox="0 0 204.8 116" preserveAspectRatio="xMidYMid meet">
      <image href="Gemini/G_Edit_2.png" x="0" y="0" width="1024" height="116"/>
    </svg>
    <text class="label" x="196" y="126">WebCam</text>
    <text class="hint" x="196" y="150">ON / OFF</text>

    <svg x="502" y="6" width="156" height="98" viewBox="204.8 0 204.8 116" preserveAspectRatio="xMidYMid meet">
      <image href="Gemini/G_Edit_2.png" x="0" y="0" width="1024" height="116"/>
    </svg>
    <text class="label" x="580" y="126">Pinch + Drag</text>
    <text class="hint" x="580" y="150">look around</text>

    <svg x="886" y="10" width="156" height="92" viewBox="409.6 0 204.8 116" preserveAspectRatio="xMidYMid meet">
      <image href="Gemini/G_Edit_2.png" x="0" y="0" width="1024" height="116"/>
    </svg>
    <text class="label" x="964" y="126">Mouse Drag</text>
    <text class="hint" x="964" y="150">hold left click</text>

    <svg x="1270" y="10" width="156" height="92" viewBox="614.4 0 204.8 116" preserveAspectRatio="xMidYMid meet">
      <image href="Gemini/G_Edit_2.png" x="0" y="0" width="1024" height="116"/>
    </svg>
    <text class="label" x="1348" y="126">Cross Reset</text>
    <text class="hint" x="1348" y="150">return to zero</text>

    <svg x="1654" y="10" width="156" height="92" viewBox="819.2 0 204.8 116" preserveAspectRatio="xMidYMid meet">
      <image href="Gemini/G_Edit_2.png" x="0" y="0" width="1024" height="116"/>
    </svg>
    <text class="label" x="1732" y="126">Stereo Guide</text>
    <text class="hint" x="1732" y="150">align dots</text>
  </g>

  <line class="divider" x1="384" y1="28" x2="384" y2="148"/>
  <line class="divider" x1="768" y1="28" x2="768" y2="148"/>
  <line class="divider" x1="1152" y1="28" x2="1152" y2="148"/>
  <line class="divider" x1="1536" y1="28" x2="1536" y2="148"/>
</svg>
