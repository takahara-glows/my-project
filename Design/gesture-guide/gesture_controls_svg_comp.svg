<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="156" viewBox="0 0 1920 156" role="img" aria-labelledby="title desc">
  <title id="title">Gesture controls UI comp from SVG icons</title>
  <desc id="desc">A bottom black UI bar using individual SVG icons with text placed horizontally beside each icon.</desc>
  <defs>
    <style>
      .bg { fill: #000; }
      .divider { stroke: #fff; stroke-width: 1; opacity: .24; }
      .label { fill: #fff; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 21px; font-weight: 700; letter-spacing: 0; }
      .hint { fill: #fff; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; font-weight: 500; letter-spacing: 0; }
      .jp { fill: #fff; font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", Inter, ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0; }
    </style>
  </defs>

  <rect class="bg" width="1920" height="156"/>

  <g>
    <image href="Icons_SVG/01_WebCam.svg" x="46" y="30" width="72" height="82"/>
    <text class="label" x="140" y="66">WebCam</text>
    <text class="hint" x="140" y="91">ON / OFF</text>
    <text class="jp" x="140" y="114">カメラ オン / オフ</text>
  </g>

  <line class="divider" x1="376" y1="28" x2="376" y2="128"/>

  <g>
    <image href="Icons_SVG/02_Pinch.svg" x="426" y="22" width="72" height="102"/>
    <text class="label" x="526" y="66">Pinch + Drag</text>
    <text class="hint" x="526" y="91">look around</text>
    <text class="jp" x="526" y="114">つまんで視点移動</text>
  </g>

  <line class="divider" x1="764" y1="28" x2="764" y2="128"/>

  <g>
    <image href="Icons_SVG/03_Mouse.svg" x="824" y="24" width="58" height="104"/>
    <text class="label" x="914" y="66">Mouse Drag</text>
    <text class="hint" x="914" y="91">look around</text>
    <text class="jp" x="914" y="114">ドラッグで視点移動</text>
  </g>

  <line class="divider" x1="1152" y1="28" x2="1152" y2="128"/>

  <g>
    <image href="Icons_SVG/04_Cross.svg" x="1198" y="38" width="114" height="80"/>
    <text class="label" x="1338" y="66">Cross Reset</text>
    <text class="hint" x="1338" y="91">return to zero</text>
    <text class="jp" x="1338" y="114">腕をクロスしてリセット</text>
  </g>

  <line class="divider" x1="1540" y1="28" x2="1540" y2="128"/>

  <g>
    <image href="Icons_SVG/05_Stereo_Guide.svg" x="1594" y="48" width="112" height="25"/>
    <text class="label" x="1736" y="66">3D Guide</text>
    <text class="hint" x="1736" y="91">merge dots</text>
    <text class="jp" x="1736" y="114">2つの点を重ねて見る</text>
  </g>
</svg>
